<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-label="dsh-injection-manager 2.0: five injection channels are clustered into switchable suites and shown in a three-tab panel with a content drawer and a cross-session trend">
  <rect width="960" height="420" rx="20" fill="#eef2f8"/>

  <!-- title -->
  <text x="32" y="40" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="600" fill="#1f2430">dsh-injection-manager 2.0</text>
  <text x="32" y="60" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#5b6472">what the next request carries · what can be switched off · what each item actually says</text>

  <!-- ============ A. five channels ============ -->
  <rect x="32" y="84" width="250" height="284" rx="12" fill="#ffffff" stroke="#e3e7ef" stroke-width="1"/>
  <text x="48" y="110" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="600" fill="#5b6472" letter-spacing=".4">FIVE INJECTION CHANNELS</text>

  <g font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12" fill="#1f2430">
