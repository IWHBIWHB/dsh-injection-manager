  <text x="336" y="292" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#8892a2">one MCP server = one suite</text>
  <text x="336" y="311" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#8892a2">closed suites stay listed</text>
  <text x="336" y="330" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#8892a2">every switch is reversible</text>

