    <text x="66" y="135">Prompt sections</text>
    <text x="266" y="135" text-anchor="end" font-size="11" fill="#5b6472">2.4k</text>
    <rect x="48" y="142" width="218" height="5" rx="2.5" fill="#eef2f8"/>
    <rect x="48" y="142" width="6" height="5" rx="2.5" fill="#6366f1"/>

    <rect x="48" y="164" width="8" height="8" rx="2" fill="#a855f7"/>
    <text x="66" y="173">Runtime contexts</text>
    <text x="266" y="173" text-anchor="end" font-size="11" fill="#5b6472">4.1k</text>
    <rect x="48" y="180" width="218" height="5" rx="2.5" fill="#eef2f8"/>
    <rect x="48" y="180" width="11" height="5" rx="2.5" fill="#a855f7"/>

    <rect x="48" y="202" width="8" height="8" rx="2" fill="#f97316"/>
    <text x="66" y="211">Skill catalog</text>
    <text x="266" y="211" text-anchor="end" font-size="11" fill="#5b6472">3.0k</text>
    <rect x="48" y="218" width="218" height="5" rx="2.5" fill="#eef2f8"/>
    <rect x="48" y="218" width="8" height="5" rx="2.5" fill="#f97316"/>

    <rect x="48" y="240" width="8" height="8" rx="2" fill="#f59e0b"/>
    <text x="66" y="249">Tool schemas</text>
    <text x="266" y="249" text-anchor="end" font-size="11" fill="#5b6472">73.4k</text>
    <rect x="48" y="256" width="218" height="5" rx="2.5" fill="#eef2f8"/>
    <rect x="48" y="256" width="191" height="5" rx="2.5" fill="#f59e0b"/>

    <rect x="48" y="278" width="8" height="8" rx="2" fill="#14b8a6"/>
    <text x="66" y="287">Workspace rules</text>
    <text x="266" y="287" text-anchor="end" font-size="11" fill="#5b6472">0.9k</text>
    <rect x="48" y="294" width="218" height="5" rx="2.5" fill="#eef2f8"/>
    <rect x="48" y="294" width="3" height="5" rx="1.5" fill="#14b8a6"/>
  </g>

  <line x1="48" y1="318" x2="266" y2="318" stroke="#e3e7ef" stroke-width="1"/>
  <text x="48" y="338" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600" fill="#1f2430">83.8k first turn</text>
  <text x="266" y="338" text-anchor="end" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11" fill="#5b6472">97% switchable</text>
  <text x="48" y="357" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#8892a2">estimates: ASCII÷4, else ÷1.6</text>

  <!-- arrow A -> B -->
  <path d="M288 226h22M302 218l8 8-8 8" fill="none" stroke="#c3ccdb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

