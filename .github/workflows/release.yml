name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # create the GitHub Release after publishing
  id-token: write # OIDC trusted publishing (preferred); a token is only a fallback

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest
      - name: Verify tag matches package version
        if: github.event_name == 'push'
        run: |
          node -e "
            const p = require('./package.json');
            const tag = process.env.GITHUB_REF_NAME;
            if (tag !== 'v' + p.version) {
              console.error('tag ' + tag + ' does not match package version ' + p.version);
              process.exit(1);
            }
          "
      - name: Syntax check
        run: |
          node --check index.js
          node --check client.js
          for file in lib/*.js; do node --check "$file"; done
      - name: Unit and integration tests
        run: node --test
      - name: Pack contents
        run: npm pack --dry-run
      - name: Check whether this version is already on npm
        id: npm-version
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "dsh-injection-manager@${version}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "dsh-injection-manager@${version} is already published; skipping publish"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish with provenance
        if: steps.npm-version.outputs.exists != 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Prefer OIDC trusted publishing: setup-node registers the id-token and
          # npm exchanges it on publish. A repository NPM_TOKEN is accepted as a
          # fallback for the first release of a version whose trusted publisher
          # has not been configured on npmjs.com yet.
          if [ -n "$NPM_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"
            echo "publishing with NPM_TOKEN fallback"
          else
            echo "publishing with OIDC trusted publishing"
          fi
          npm publish --access public --provenance
      - name: Create GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
